# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Set these variables to have the correct exercise name and module title.
env:
  EXERCISE_NAME: "ai-training-output-verification-and-human-in-the-loop"
  MODULE_TITLE: "Output verification and human-in-the-loop"

# Trigger on any push that includes student work files.
on:
  push:
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  check_initial_commit:
    name: Check if initial commit
    runs-on: ubuntu-latest
    outputs:
      is-initial: ${{ steps.check.outputs.is-initial }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit count
        id: check
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "is-initial=$([[ $commit_count -eq 1 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  find_exercise:
    name: Find Exercise Issue
    needs: check_initial_commit
    if: needs.check_initial_commit.outputs.is-initial == 'false'
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.8.1

  post_checking_message:
    name: Post checking work message
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post checking work message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/markdown-templates/exercise/checking-work.md

  validate_exercise:
    name: Validate exercise
    runs-on: ubuntu-latest
    needs: post_checking_message
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Check required files exist
        run: |
          test -f docs/requirement-raw.md || (echo "::error::docs/requirement-raw.md is missing — do not delete the original requirement" && exit 1)
          test -f docs/requirement-clean.md || (echo "::error::docs/requirement-clean.md is missing — complete Step 1 of the exercise first" && exit 1)
          test -s docs/requirement-clean.md || (echo "::error::docs/requirement-clean.md is empty — complete Step 1 of the exercise first" && exit 1)

      - name: Verify the requirement was actually scrubbed
        run: |
          set -e
          RAW=docs/requirement-raw.md
          CLEAN=docs/requirement-clean.md
          INITIAL_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          TRUSTED_RAW=$(mktemp)
          NORMALIZED_CLEAN_PHONES=$(mktemp)
          trap 'rm -f "$TRUSTED_RAW" "$NORMALIZED_CLEAN_PHONES"' EXIT

          if ! git cat-file -e "$INITIAL_COMMIT:$RAW"; then
            echo "::error::Unable to load the original docs/requirement-raw.md from the initial commit"
            exit 1
          fi

          git show "$INITIAL_COMMIT:$RAW" > "$TRUSTED_RAW"

          if ! cmp -s "$RAW" "$TRUSTED_RAW"; then
            echo "::error::docs/requirement-raw.md was modified — Step 1 requires keeping the original requirement unchanged"
            exit 1
          fi

          if cmp -s "$TRUSTED_RAW" "$CLEAN"; then
            echo "::error::docs/requirement-clean.md is identical to docs/requirement-raw.md — Step 1 asks you to remove sensitive information, not just copy the file"
            exit 1
          fi

          fail=0

          check_literal_removal() {
            value=$1
            description=$2

            # Trim whitespace picked up by greedy sed extraction so leaked text isn't
            # missed just because the student used different trailing punctuation.
            value=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            [ -z "$value" ] && return 0

            if grep -qF "$value" "$CLEAN"; then
              echo "::error::docs/requirement-clean.md still contains ${description} '$value' — remove or replace it"
              fail=1
            fi
          }

          extract_phone_tokens() {
            grep -Eo '\+?[0-9][0-9() -]{6,}[0-9]' "$1" | sort -u
          }

          # Personal-looking email addresses (firstname.lastname@...) from the raw
          # requirement must not survive into the clean version. Generic team
          # aliases (e.g. dev-team@internal.test) are not flagged.
          while IFS= read -r email; do
            [ -z "$email" ] && continue
            check_literal_removal "$email" "the email address"
          done < <(grep -Eo '[A-Za-z0-9]+\.[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$TRUSTED_RAW" | sort -u)

          # Phone numbers from the raw requirement must not survive into the clean
          # version even if the student reformats separators or spacing.
          extract_phone_tokens "$CLEAN" \
            | while IFS= read -r phone; do
                printf '%s\n' "$(printf '%s' "$phone" | tr -cd '[:digit:]')"
              done \
            | sort -u > "$NORMALIZED_CLEAN_PHONES"
          while IFS= read -r phone; do
            [ -z "$phone" ] && continue
            normalized_phone=$(printf '%s' "$phone" | tr -cd '[:digit:]')
            if grep -qxF "$normalized_phone" "$NORMALIZED_CLEAN_PHONES"; then
              echo "::error::docs/requirement-clean.md still contains the phone number '$phone' — remove or replace it"
              fail=1
            fi
          done < <(extract_phone_tokens "$TRUSTED_RAW")

          check_literal_removal "$(sed -nE 's/^From: ([^<]+) <.*$/\1/p' "$TRUSTED_RAW")" "the personal name"
          check_literal_removal "$(sed -nE 's/^Client contact: ([^(,]+).*$/\1/p' "$TRUSTED_RAW")" "the personal name"
          check_literal_removal "$(sed -nE 's/^Internal project code: (.+)$/\1/p' "$TRUSTED_RAW")" "the internal project code"
          check_literal_removal "$(sed -nE 's/^If you need access to the staging environment to test: (.+)$/\1/p' "$TRUSTED_RAW")" "the credential"

          while IFS= read -r amount; do
            [ -z "$amount" ] && continue
            check_literal_removal "$amount" "the real spending figure"
          done < <(awk -F'|' '
            /^Category[[:space:]]+\|/ { in_table=1; next }
            in_table && /^[-|[:space:]]+$/ { next }
            in_table && /^[[:space:]]*$/ { in_table=0; next }
            in_table {
              for (i = 3; i <= NF; i++) {
                value = $i
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                if (value != "") print value
              }
            }
          ' "$TRUSTED_RAW" | sort -u)

          # The clean version must still contain the actual functional requirements —
          # scrubbing sensitive details is not the same as gutting the requirement.
          check_content_preserved() {
            value=$1
            description=$2

            if ! grep -qF "$value" "$CLEAN"; then
              echo "::error::docs/requirement-clean.md is missing ${description} — Step 1 asks you to remove sensitive information, not the actual requirements"
              fail=1
            fi
          }

          check_content_preserved "budget category" "the budget category requirement"
          check_content_preserved "monthly spending limit" "the monthly spending limit requirement"
          check_content_preserved "dashboard" "the dashboard requirement"

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

  post_final_content:
    name: Post final content
    needs: [find_exercise, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable current workflow
        run: |
          gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build final comment from local template
        id: build-final-comment
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/exercise-finished.md
          template-vars: |
            title: ${{ env.MODULE_TITLE }}
            login: ${{ github.actor }}
            repo_full_name: ${{ github.repository }}

      - name: Build final README from local template
        id: build-final-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/readme/exercise-finished.md
          template-vars: |
            login: ${{ github.actor }}
            issue_url: ${{ env.ISSUE_URL }}

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with final message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-final-comment.outputs.updated-text }}
          edit-mode: replace

      - name: Close issue
        run: |
          gh issue close ${{ env.ISSUE_NUMBER }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        env:
          README_TEXT: ${{ steps.build-final-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Congratulations!🎉"
          default_author: github_actions

  post_mistake_message:
    name: Post mistake message
    needs: [find_exercise, validate_exercise]
    if: always() && needs.validate_exercise.result == 'failure'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mistake message from local template
        id: build-mistake-message
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/step-mistake.md
          template-vars: |
            feedback_message: >
              The checks failed. Make sure:

              - `docs/requirement-clean.md` exists (Step 1 of the exercise)

              - `docs/requirement-clean.md` actually has the sensitive information removed —
              `docs/requirement-raw.md` must stay unchanged, and the clean file must not still
              contain any personal names, contact details, internal project code, real spending
              data, or credentials from the original requirement

              - The backend typechecks pass — run `npm run typecheck` from `backend/`

              - The backend tests pass — run `npm test` from `backend/`

              Check the Actions tab for the full error output.

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with mistake message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-mistake-message.outputs.updated-text }}
          edit-mode: replace
