# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Trigger on any push that includes student work files.
on:
  push:
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  exercise_checking:
    name: Start checking
    uses: ./.github/workflows/exercise-checking.yml

  validate_exercise:
    name: Validate exercise
    runs-on: ubuntu-latest
    needs: exercise_checking
    if: needs.exercise_checking.outputs.comment-id != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Check required files exist
        run: |
          test -f docs/requirement-raw.md || (echo "::error::docs/requirement-raw.md is missing — do not delete the original requirement" && exit 1)
          test -f docs/requirement-clean.md || (echo "::error::docs/requirement-clean.md is missing — complete Step 1 of the exercise first" && exit 1)
          test -s docs/requirement-clean.md || (echo "::error::docs/requirement-clean.md is empty — complete Step 1 of the exercise first" && exit 1)

      - name: Verify the requirement was actually scrubbed
        run: |
          set -e
          RAW=docs/requirement-raw.md
          CLEAN=docs/requirement-clean.md
          INITIAL_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          TRUSTED_RAW=$(mktemp)
          NORMALIZED_CLEAN_PHONES=$(mktemp)
          LIST=$(mktemp)
          trap 'rm -f "$TRUSTED_RAW" "$NORMALIZED_CLEAN_PHONES" "$LIST"' EXIT

          if ! git cat-file -e "$INITIAL_COMMIT:$RAW"; then
            echo "::error::Unable to load the original docs/requirement-raw.md from the initial commit"
            exit 1
          fi

          git show "$INITIAL_COMMIT:$RAW" > "$TRUSTED_RAW"

          if ! cmp -s "$RAW" "$TRUSTED_RAW"; then
            echo "::error::docs/requirement-raw.md was modified — Step 1 requires keeping the original requirement unchanged"
            exit 1
          fi

          if cmp -s "$TRUSTED_RAW" "$CLEAN"; then
            echo "::error::docs/requirement-clean.md is identical to docs/requirement-raw.md — Step 1 asks you to remove sensitive information, not just copy the file"
            exit 1
          fi

          fail=0

          check_literal_removal() {
            value=$1
            description=$2

            # Trim whitespace picked up by greedy sed extraction so leaked text isn't
            # missed just because the student used different trailing punctuation.
            value=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            [ -z "$value" ] && return 0

            if grep -qF "$value" "$CLEAN"; then
              echo "::error::docs/requirement-clean.md still contains ${description} '$value' — remove or replace it"
              fail=1
            fi
          }

          extract_phone_tokens() {
            grep -Eo '\+?[0-9][0-9() -]{6,}[0-9]' "$1" | sort -u
          }

          # Personal-looking email addresses (firstname.lastname@...) from the raw
          # requirement must not survive into the clean version. Generic team
          # aliases (e.g. dev-team@internal.test) are not flagged.
          grep -Eo '[A-Za-z0-9]+\.[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$TRUSTED_RAW" | sort -u > "$LIST" || true
          while IFS= read -r email; do
            [ -z "$email" ] && continue
            check_literal_removal "$email" "the email address"
          done < "$LIST"

          # Phone numbers from the raw requirement must not survive into the clean
          # version even if the student reformats separators or spacing.
          extract_phone_tokens "$CLEAN" \
            | while IFS= read -r phone; do
                printf '%s\n' "$(printf '%s' "$phone" | tr -cd '[:digit:]')"
              done \
            | sort -u > "$NORMALIZED_CLEAN_PHONES"
          extract_phone_tokens "$TRUSTED_RAW" > "$LIST" || true
          while IFS= read -r phone; do
            [ -z "$phone" ] && continue
            normalized_phone=$(printf '%s' "$phone" | tr -cd '[:digit:]')
            if grep -qxF "$normalized_phone" "$NORMALIZED_CLEAN_PHONES"; then
              echo "::error::docs/requirement-clean.md still contains the phone number '$phone' — remove or replace it"
              fail=1
            fi
          done < "$LIST"

          check_literal_removal "$(sed -nE 's/^From: ([^<]+) <.*$/\1/p' "$TRUSTED_RAW")" "the personal name"
          check_literal_removal "$(sed -nE 's/^Client contact: ([^(,]+).*$/\1/p' "$TRUSTED_RAW")" "the personal name"
          check_literal_removal "$(sed -nE 's/^Internal project code: (.+)$/\1/p' "$TRUSTED_RAW")" "the internal project code"
          check_literal_removal "$(sed -nE 's/^If you need access to the staging environment to test: (.+)$/\1/p' "$TRUSTED_RAW")" "the credential"

          awk -F'|' '
            /^Category[[:space:]]+\|/ { in_table=1; next }
            in_table && /^[-|[:space:]]+$/ { next }
            in_table && /^[[:space:]]*$/ { in_table=0; next }
            in_table {
              for (i = 3; i <= NF; i++) {
                value = $i
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                if (value != "") print value
              }
            }
          ' "$TRUSTED_RAW" | sort -u > "$LIST"
          while IFS= read -r amount; do
            [ -z "$amount" ] && continue
            check_literal_removal "$amount" "the real spending figure"
          done < "$LIST"

          # The clean version must still contain the actual functional requirements —
          # scrubbing sensitive details is not the same as gutting the requirement.
          check_content_preserved() {
            value=$1
            description=$2

            if ! grep -qF "$value" "$CLEAN"; then
              echo "::error::docs/requirement-clean.md is missing ${description} — Step 1 asks you to remove sensitive information, not the actual requirements"
              fail=1
            fi
          }

          check_content_preserved "budget category" "the budget category requirement"
          check_content_preserved "monthly spending limit" "the monthly spending limit requirement"
          check_content_preserved "dashboard" "the dashboard requirement"

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

  exercise_passed:
    name: Exercise passed
    needs: [exercise_checking, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    uses: ./.github/workflows/exercise-passed.yml
    with:
      module-title: "Output verification and human-in-the-loop"
      issue-url: ${{ needs.exercise_checking.outputs.issue-url }}
      issue-number: ${{ needs.exercise_checking.outputs.issue-number }}
      comment-id: ${{ needs.exercise_checking.outputs.comment-id }}

  exercise_failed:
    name: Exercise failed
    needs: [exercise_checking, validate_exercise]
    if: always() && needs.validate_exercise.result == 'failure'
    uses: ./.github/workflows/exercise-failed.yml
    with:
      comment-id: ${{ needs.exercise_checking.outputs.comment-id }}
      feedback-message: |
        The checks failed. Make sure:

        - `docs/requirement-clean.md` exists (Step 1 of the exercise)

        - `docs/requirement-clean.md` actually has the sensitive information removed — `docs/requirement-raw.md` must stay unchanged, and the clean file must not still contain any personal names, contact details, internal project code, real spending data, or credentials from the original requirement

        - The backend typechecks pass — run `npm run typecheck` from `backend/`

        - The backend tests pass — run `npm test` from `backend/`

        Check the Actions tab for the full error output.
